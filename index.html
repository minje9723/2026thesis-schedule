<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Premium Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">LUMINA</div>
        <div class="nav-links">
            <a href="#products">Products</a>
            <a href="#features">Features</a>
            <a href="#about">About</a>
        </div>
        <button class="cta-button">Pre-order Now</button>
    </nav>

    <main>
        <section class="hero">
            <div class="hero-content">
                <div class="badge">New Arrival</div>
                <h1>Experience the <span class="gradient-text">Future</span></h1>
                <p>Unleash creativity with the next generation of smart technology. Designed for visionaries.</p>
                <div class="hero-buttons">
                    <button class="primary-btn">Explore Series X</button>
                    <button class="secondary-btn">Watch Video</button>
                </div>
            </div>
            <div class="hero-visual">
                <div class="glowing-orb"></div>
                <div class="glass-card">
                    <div class="card-content">
                        <h3>Series X</h3>
                        <p>Ultra Performance</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="features" class="features">
            <div class="feature-card">
                <h3>Speed</h3>
                <p>Lightning fast processing.</p>
            </div>
            <div class="feature-card">
                <h3>Design</h3>
                <p>Seamless glass body.</p>
            </div>
            <div class="feature-card">
                <h3>Power</h3>
                <p>All day battery life.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
